<h2>Admin Panel</h2>
<input id="token" placeholder="Admin Token">
<div id="admin"></div>

<script>
const API2 = "https://review-widget.onrender.com"; // REPLACE with your Render URL

async function loadAdmin(){
  const token = document.getElementById("token").value;
  const res = await fetch(API2+"/admin/reviews", { headers: { Authorization: token }});
  const data = await res.json();
  const container = document.getElementById("admin");
  container.innerHTML="";
  data.forEach(r=>{
    container.innerHTML+=`
      <div>
        <b>${r.name}</b> (${r.rating}★)
        <p>${r.text}</p>
        ${r.image ? `<img src="${r.image}" width="100">` : ""}
        <br>
        <button onclick="approve(${r.id})">Approve</button>
        <button onclick="del(${r.id})">Delete</button>
      </div><hr>`;
  });
}

async function approve(id){
  const token = document.getElementById("token").value;
  await fetch(API2+"/admin/approve/"+id, { method:"POST", headers:{Authorization:token} });
  loadAdmin();
}

async function del(id){
  const token = document.getElementById("token").value;
  await fetch(API2+"/admin/delete/"+id, { method:"DELETE", headers:{Authorization:token} });
  loadAdmin();
}

loadAdmin();
</script>
