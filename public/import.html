<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AppLogix Internal Google Review Import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    :root {
      --primary: #2563eb;
      --secondary: #4ea3ff;
      --dark: #0f172a;
      --text: #334155;
      --muted: #64748b;
      --bg: #f5f8ff;
      --card: #ffffff;
      --border: #dbe7fb;
      --success: #15803d;
      --error: #b91c1c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #f7fbff 0%, #eef5ff 100%);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 18px;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
      overflow: hidden;
    }

    .topbar {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      color: white;
      padding: 20px 24px;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .content {
      padding: 24px;
    }

    h1 {
      margin: 0 0 8px;
      color: var(--dark);
      font-size: 2rem;
    }

    p.sub {
      margin: 0 0 22px;
      color: var(--muted);
    }

    .section {
      margin-bottom: 26px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: #fbfdff;
    }

    .section h2 {
      margin: 0 0 14px;
      color: #1e3a8a;
      font-size: 1.2rem;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--dark);
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d6e4fb;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 14px;
      background: white;
      color: var(--dark);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .btn {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-primary {
      background: linear-gradient(90deg, var(--secondary), var(--primary));
      color: white;
      width: 100%;
    }

    .btn-secondary {
      background: white;
      border: 1px solid var(--border);
      color: var(--primary);
      width: 100%;
    }

    .status {
      margin-top: 10px;
      font-weight: 700;
      min-height: 22px;
    }

    .status.success { color: var(--success); }
    .status.error { color: var(--error); }

    .hidden {
      display: none;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .client-meta {
      margin-top: 8px;
      padding: 12px 14px;
      border-radius: 12px;
      background: #eef5ff;
      border: 1px solid var(--border);
      color: var(--dark);
      font-size: 0.95rem;
    }

    @media (max-width: 700px) {
      .row {
        grid-template-columns: 1fr;
      }

      .content {
        padding: 18px;
      }

      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="topbar">AppLogix Internal Tool</div>

      <div class="content">
        <h1>Google Review Import</h1>
        <p class="sub">
          Internal Premium-only review import tool. Log in with the AppLogix admin token, select a client, and import Google reviews directly.
        </p>

        <div class="section" id="loginSection">
          <h2>Internal Access</h2>
          <label for="adminToken">Admin Token</label>
          <input type="password" id="adminToken" placeholder="Enter admin token" />
          <button class="btn btn-primary" id="loginBtn">Unlock Import Tool</button>
          <div class="status" id="loginStatus"></div>
        </div>

        <div class="section hidden" id="importSection">
          <h2>Premium Client Selection</h2>

          <label for="clientSelect">Choose Client</label>
          <select id="clientSelect">
            <option value="">Loading eligible clients...</option>
          </select>

          <div class="client-meta hidden" id="clientMeta"></div>

          <hr style="margin: 18px 0; border: none; border-top: 1px solid #e5eefc;">

          <div class="row">
            <div>
              <label for="reviewerName">Reviewer Name</label>
              <input type="text" id="reviewerName" placeholder="Reviewer name" />
            </div>

            <div>
              <label for="rating">Rating</label>
              <select id="rating">
                <option value="">Choose rating</option>
                <option value="5">5</option>
                <option value="4">4</option>
                <option value="3">3</option>
                <option value="2">2</option>
                <option value="1">1</option>
              </select>
            </div>
          </div>

          <label for="reviewText">Review Text</label>
          <textarea id="reviewText" placeholder="Paste Google review text here"></textarea>

          <label for="imageUrl">Image URL (optional)</label>
          <input type="text" id="imageUrl" placeholder="Optional image URL" />

          <button class="btn btn-primary" id="importBtn">Import Review</button>
          <div class="status" id="importStatus"></div>

          <div style="margin-top: 14px;">
            <button class="btn btn-secondary" id="reloadBtn">Reload Premium Client List</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let ADMIN_TOKEN = "";
    let clients = [];

    const loginSection = document.getElementById("loginSection");
    const importSection = document.getElementById("importSection");

    const adminTokenInput = document.getElementById("adminToken");
    const loginBtn = document.getElementById("loginBtn");
    const loginStatus = document.getElementById("loginStatus");

    const clientSelect = document.getElementById("clientSelect");
    const clientMeta = document.getElementById("clientMeta");

    const reviewerName = document.getElementById("reviewerName");
    const rating = document.getElementById("rating");
    const reviewText = document.getElementById("reviewText");
    const imageUrl = document.getElementById("imageUrl");
    const importBtn = document.getElementById("importBtn");
    const importStatus = document.getElementById("importStatus");
    const reloadBtn = document.getElementById("reloadBtn");

    function setStatus(el, message, type = "") {
      el.textContent = message;
      el.className = "status" + (type ? " " + type : "");
    }

    function getSelectedClient() {
      return clients.find(c => c.businessId === clientSelect.value) || null;
    }

    function renderClientMeta() {
      const client = getSelectedClient();
      if (!client) {
        clientMeta.classList.add("hidden");
        clientMeta.textContent = "";
        return;
      }

      clientMeta.classList.remove("hidden");
      clientMeta.innerHTML = `
        <strong>Business:</strong> ${client.businessName}<br>
        <strong>Business ID:</strong> ${client.businessId}<br>
        <strong>Email:</strong> ${client.email || "(not available)"}
      `;
    }

    async function loadClients() {
      clientSelect.innerHTML = `<option value="">Loading eligible clients...</option>`;
      clientMeta.classList.add("hidden");
      clientMeta.textContent = "";

      try {
        const res = await fetch("/ops-import-clients", {
          method: "GET",
          headers: {
            "x-admin-token": ADMIN_TOKEN
          }
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(msg || "Failed to load clients.");
        }

        clients = await res.json();

        if (!clients.length) {
          clientSelect.innerHTML = `<option value="">No eligible Premium clients found</option>`;
          return;
        }

        clientSelect.innerHTML = `<option value="">Select a Premium client</option>`;
        for (const client of clients) {
          const opt = document.createElement("option");
          opt.value = client.businessId;
          opt.textContent = `${client.businessName} (${client.businessId})`;
          clientSelect.appendChild(opt);
        }
      } catch (err) {
        clientSelect.innerHTML = `<option value="">Failed to load clients</option>`;
        setStatus(loginStatus, err.message || "Failed to load clients.", "error");
      }
    }

    loginBtn.addEventListener("click", async () => {
      const token = adminTokenInput.value.trim();
      if (!token) {
        setStatus(loginStatus, "Enter the admin token.", "error");
        return;
      }

      ADMIN_TOKEN = token;
      setStatus(loginStatus, "Checking access...");

      try {
        const res = await fetch("/ops-import-clients", {
          method: "GET",
          headers: {
            "x-admin-token": ADMIN_TOKEN
          }
        });

        if (!res.ok) {
          const msg = await res.text();
          throw new Error(msg || "Invalid admin token.");
        }

        clients = await res.json();

        loginSection.classList.add("hidden");
        importSection.classList.remove("hidden");

        if (!clients.length) {
          clientSelect.innerHTML = `<option value="">No eligible Premium clients found</option>`;
        } else {
          clientSelect.innerHTML = `<option value="">Select a Premium client</option>`;
          for (const client of clients) {
            const opt = document.createElement("option");
            opt.value = client.businessId;
            opt.textContent = `${client.businessName} (${client.businessId})`;
            clientSelect.appendChild(opt);
          }
        }
      } catch (err) {
        setStatus(loginStatus, err.message || "Access failed.", "error");
      }
    });

    clientSelect.addEventListener("change", renderClientMeta);

    reloadBtn.addEventListener("click", async () => {
      setStatus(importStatus, "Reloading client list...");
      await loadClients();
      setStatus(importStatus, "Client list reloaded.", "success");
    });

    importBtn.addEventListener("click", async () => {
      const client = getSelectedClient();

      if (!client) {
        setStatus(importStatus, "Choose a Premium client first.", "error");
        return;
      }

      if (!reviewerName.value.trim()) {
        setStatus(importStatus, "Reviewer name is required.", "error");
        return;
      }

      if (!rating.value) {
        setStatus(importStatus, "Rating is required.", "error");
        return;
      }

      if (!reviewText.value.trim()) {
        setStatus(importStatus, "Review text is required.", "error");
        return;
      }

      setStatus(importStatus, "Importing review...");

      try {
        const res = await fetch("/ops-import-google-review", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "x-admin-token": ADMIN_TOKEN
          },
          body: JSON.stringify({
            businessId: client.businessId,
            name: reviewerName.value.trim(),
            rating: parseInt(rating.value, 10),
            text: reviewText.value.trim(),
            image: imageUrl.value.trim()
          })
        });

        const text = await res.text();
        if (!res.ok) {
          throw new Error(text || "Import failed.");
        }

        reviewerName.value = "";
        rating.value = "";
        reviewText.value = "";
        imageUrl.value = "";

        setStatus(importStatus, "Google review imported successfully.", "success");
      } catch (err) {
        setStatus(importStatus, err.message || "Import failed.", "error");
      }
    });
  </script>
</body>
</html>
