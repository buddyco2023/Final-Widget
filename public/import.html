<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Google Review Import</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .title {
      font-size: 28px;
      font-weight: 800;
      margin: 0 0 8px;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      border: 1px solid #e4eefc;
      margin-bottom: 18px;
    }

    .input, .textarea, .select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #cfdcf3;
      background: #f9fbff;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .textarea {
      min-height: 160px;
      resize: vertical;
      font-family: Arial, sans-serif;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%);
      color: white;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: #475569;
      white-space: pre-wrap;
    }

    .note {
      font-size: 13px;
      color: #64748b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">
        <h1 class="title">Google Review Import</h1>
        <div class="sub">Use this to manually import Google reviews into the AppLogix system.</div>

        <div class="card" id="loginCard">
          <input id="email" class="input" type="text" placeholder="Admin email">
          <input id="password" class="input" type="password" placeholder="Password">
          <button class="btn" onclick="importLogin()">Login</button>
          <div id="loginStatus" class="status">Ready.</div>
        </div>

        <div class="card" id="importCard" style="display:none;">
          <input id="businessId" class="input" type="text" placeholder="Business ID (example: kenorabuddyco)">
          <input id="reviewerName" class="input" type="text" placeholder="Reviewer name">
          <select id="rating" class="select">
            <option value="">Select rating</option>
            <option value="5">5 stars</option>
            <option value="4">4 stars</option>
            <option value="3">3 stars</option>
            <option value="2">2 stars</option>
            <option value="1">1 star</option>
          </select>
          <textarea id="reviewText" class="textarea" placeholder="Paste the Google review text here"></textarea>
          <input id="imageUrl" class="input" type="text" placeholder="Optional image URL">
          <button class="btn" onclick="submitImportedReview()">Import Google Review</button>
          <div class="note">Imported reviews are saved as approved and tagged as Google reviews automatically.</div>
          <div id="importStatus" class="status"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    let supabase = null;
    let session = null;

    async function init() {
      const res = await fetch("/client-config?ts=" + Date.now(), { cache: "no-store" });
      const cfg = await res.json();
      supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }

    window.importLogin = async function () {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const loginStatus = document.getElementById("loginStatus");

      if (!email || !password) {
        loginStatus.textContent = "Enter email and password.";
        return;
      }

      loginStatus.textContent = "Logging in...";

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        loginStatus.textContent = error.message;
        return;
      }

      session = data.session;
      loginStatus.textContent = "Logged in.";
      document.getElementById("importCard").style.display = "block";
    };

    window.submitImportedReview = async function () {
      const businessId = document.getElementById("businessId").value.trim();
      const name = document.getElementById("reviewerName").value.trim();
      const rating = document.getElementById("rating").value;
      const text = document.getElementById("reviewText").value.trim();
      const image = document.getElementById("imageUrl").value.trim();
      const importStatus = document.getElementById("importStatus");

      if (!session) {
        importStatus.textContent = "Please log in first.";
        return;
      }

      importStatus.textContent = "Importing...";

      const res = await fetch("/import-google-review", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({
          businessId,
          name,
          rating,
          text,
          image
        })
      });

      if (!res.ok) {
        const err = await res.text();
        importStatus.textContent = "Import failed: " + err;
        return;
      }

      importStatus.textContent = "Google review imported successfully.";

      document.getElementById("reviewerName").value = "";
      document.getElementById("rating").value = "";
      document.getElementById("reviewText").value = "";
      document.getElementById("imageUrl").value = "";
    };

    init();
  </script>
</body>
</html>
