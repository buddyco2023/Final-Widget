<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Hosted Review Page</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
    }
  </style>
</head>
<body>

<div id="applogix-review-widget"></div>

<style>
#applogix-review-widget {
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  color: #1f2937;
  max-width: 980px;
  margin: 24px auto;
  padding: 0 16px;
}

.arw-card {
  background: #ffffff;
  border-radius: 28px;
  overflow: hidden;
  box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
  border: 1px solid #e5eefc;
}

.arw-topbar {
  height: 58px;
  background: linear-gradient(90deg, var(--brand-secondary) 0%, var(--brand-primary) 100%);
}

.arw-content {
  padding: 24px;
  background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
}

.arw-summary-card {
  background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
  border-radius: 22px;
  padding: 20px;
  margin-bottom: 22px;
  box-shadow: 0 14px 28px rgba(15, 23, 42, 0.10), 0 3px 8px rgba(15, 23, 42, 0.05);
  border: 1px solid #e4eefc;
  text-align: center;
}

.arw-brand-header-name {
  font-size: 24px;
  font-weight: 800;
  color: var(--brand-primary);
  margin-bottom: 12px;
}

.arw-summary-title {
  font-size: 14px;
  color: #64748b;
  margin-bottom: 10px;
  font-weight: 700;
}

.arw-summary-rating-row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}

.arw-summary-number {
  font-size: 34px;
  font-weight: 800;
  color: var(--brand-primary);
}

.arw-summary-stars {
  font-size: 26px;
  letter-spacing: 2px;
  color: var(--brand-accent-gold);
}

.arw-summary-count {
  margin-top: 10px;
  color: #64748b;
  font-size: 14px;
}

.arw-list {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
  margin-bottom: 28px;
}

.arw-review {
  background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
  border-radius: 22px;
  padding: 20px;
  box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12), 0 3px 8px rgba(15, 23, 42, 0.06);
  border: 1px solid #e4eefc;
}

.arw-review-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 8px;
}

.arw-review-name {
  font-size: 18px;
  font-weight: 800;
  color: #1f2937;
}

.arw-source-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: #eff6ff;
  color: #1d4ed8;
  border: 1px solid #bfdbfe;
  border-radius: 999px;
  padding: 5px 10px;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
}

.arw-stars {
  margin-bottom: 12px;
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--brand-accent-gold);
}

.arw-review-text {
  line-height: 1.6;
  color: #334155;
}

.arw-review img {
  width: 100%;
  display: block;
  border-radius: 16px;
  margin-top: 12px;
  box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
}

.arw-empty {
  grid-column: 1 / -1;
  text-align: center;
  background: #fff;
  padding: 24px;
  border-radius: 20px;
  color: #64748b;
  box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
}

.arw-form-card {
  background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
  border-radius: 24px;
  padding: 24px;
  box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12), 0 3px 8px rgba(15, 23, 42, 0.06);
  border: 1px solid #e4eefc;
}

.arw-subtitle {
  margin: 0 0 16px;
  font-size: 24px;
  font-weight: 800;
  color: var(--brand-primary);
}

.arw-input,
.arw-file {
  width: 100%;
  box-sizing: border-box;
  margin-bottom: 13px;
  padding: 13px 15px;
  border-radius: 16px;
  border: 1px solid #cfdcf3;
  background: #f9fbff;
  font-size: 15px;
  color: #1f2937;
}

.arw-textarea {
  min-height: 130px;
  resize: vertical;
  font-family: Georgia, "Times New Roman", serif;
  font-size: 17px;
  font-style: italic;
  color: #475569;
  margin-top: 14px;
}

.arw-rating-block {
  margin-bottom: 14px;
  padding: 14px 16px;
  border-radius: 18px;
  border: 1px solid #cfdcf3;
  background: #f9fbff;
}

.arw-rating-label {
  font-size: 15px;
  font-weight: 700;
  color: #334155;
  margin-bottom: 10px;
}

.arw-star-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.arw-star-btn {
  border: none;
  background: transparent;
  font-size: 32px;
  line-height: 1;
  cursor: pointer;
  padding: 4px;
  border-radius: 14px;
  color: #d7dce5;
}

.arw-star-btn.active {
  color: var(--brand-accent-gold);
}

.arw-button {
  width: 100%;
  border: none;
  border-radius: 16px;
  padding: 15px 18px;
  background: linear-gradient(180deg, var(--brand-secondary) 0%, var(--brand-primary) 100%);
  color: #ffffff;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
}

.arw-note {
  margin-top: 12px;
  font-size: 13px;
  color: #64748b;
}

.arw-footer {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 14px 20px;
  background: #ffffff;
  border-top: 1px solid #e5eefc;
}

.arw-powered {
  color: #6b7280;
  font-size: 13px;
}

.arw-brand-text {
  font-size: 14px;
  font-weight: 800;
  color: #1f2937;
}

@media (max-width: 900px) {
  .arw-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 640px) {
  .arw-list {
    grid-template-columns: 1fr;
  }
}
</style>

<script>
const ARW_API = "https://final-widget.onrender.com";
const BUSINESS_ID = window.location.pathname.split("/").pop();

const BRAND_NAME = BUSINESS_ID.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
const BRAND_PRIMARY = "#2563eb";
const BRAND_SECONDARY = "#4ea3ff";
const BRAND_ACCENT_GOLD = "#ffd84d";

let ARW_SELECTED_RATING = 0;
let ARW_ALL_REVIEWS = [];

function arwMountWidget() {
  const root = document.getElementById("applogix-review-widget");
  root.style.setProperty("--brand-primary", BRAND_PRIMARY);
  root.style.setProperty("--brand-secondary", BRAND_SECONDARY);
  root.style.setProperty("--brand-accent-gold", BRAND_ACCENT_GOLD);

  root.innerHTML = `
    <div class="arw-card">
      <div class="arw-topbar"></div>

      <div class="arw-content">
        <div class="arw-summary-card">
          <div class="arw-brand-header-name">${BRAND_NAME}</div>
          <div class="arw-summary-title">Customer Rating</div>
          <div class="arw-summary-rating-row">
            <div class="arw-summary-number" id="arw-average-number">0.0</div>
            <div class="arw-summary-stars" id="arw-average-stars">☆☆☆☆☆</div>
          </div>
          <div class="arw-summary-count" id="arw-review-count">0 reviews</div>
        </div>

        <div id="arw-list" class="arw-list"></div>

        <div class="arw-form-card">
          <h3 class="arw-subtitle">Leave a Review</h3>

          <input id="arw-name" class="arw-input" type="text" placeholder="Your name">

          <div class="arw-rating-block">
            <div class="arw-rating-label">Select rating</div>
            <div class="arw-star-picker">
              <button type="button" class="arw-star-btn" id="arw-star-1" onclick="arwSetRating(1)">★</button>
              <button type="button" class="arw-star-btn" id="arw-star-2" onclick="arwSetRating(2)">★</button>
              <button type="button" class="arw-star-btn" id="arw-star-3" onclick="arwSetRating(3)">★</button>
              <button type="button" class="arw-star-btn" id="arw-star-4" onclick="arwSetRating(4)">★</button>
              <button type="button" class="arw-star-btn" id="arw-star-5" onclick="arwSetRating(5)">★</button>
            </div>
          </div>

          <textarea id="arw-text" class="arw-input arw-textarea" placeholder="Share your experience..."></textarea>

          <input id="arw-image" class="arw-file" type="file" accept="image/jpeg,image/png,image/webp">

          <button id="arw-submit" class="arw-button" onclick="arwSubmitReview()">Submit Review</button>

          <div class="arw-note">Reviews are submitted for approval before appearing on the page.</div>
        </div>
      </div>

      <div class="arw-footer">
        <span class="arw-powered">Powered by:</span>
        <span class="arw-brand-text">AppLogix</span>
      </div>
    </div>
  `;
}

function arwSetRating(value) {
  ARW_SELECTED_RATING = value;
  for (let i = 1; i <= 5; i++) {
    const star = document.getElementById("arw-star-" + i);
    if (star) {
      star.classList.toggle("active", i <= value);
    }
  }
}

function arwRenderAverageStars(avg) {
  const rounded = Math.round(avg);
  return "★".repeat(rounded) + "☆".repeat(5 - rounded);
}

function arwNormalizeSource(review) {
  if (review.source === "google") return "google";
  return "widget";
}

async function arwUploadToCloudinary(file) {
  const signRes = await fetch(ARW_API + "/cloudinary-signature");
  if (!signRes.ok) throw new Error("Could not prepare image upload");

  const signData = await signRes.json();

  const formData = new FormData();
  formData.append("file", file);
  formData.append("api_key", signData.apiKey);
  formData.append("timestamp", signData.timestamp);
  formData.append("folder", signData.folder);
  formData.append("signature", signData.signature);

  const uploadRes = await fetch("https://api.cloudinary.com/v1_1/" + signData.cloudName + "/image/upload", {
    method: "POST",
    body: formData
  });

  if (!uploadRes.ok) {
    const txt = await uploadRes.text();
    throw new Error(txt || "Image upload failed");
  }

  const uploadData = await uploadRes.json();
  return uploadData.secure_url;
}

async function arwSubmitReview() {
  const btn = document.getElementById("arw-submit");
  const name = document.getElementById("arw-name").value;
  const text = document.getElementById("arw-text").value;
  const file = document.getElementById("arw-image").files[0];

  if (!ARW_SELECTED_RATING) {
    alert("Please select a rating.");
    return;
  }

  btn.disabled = true;
  btn.textContent = "Submitting...";

  try {
    let imageUrl = null;

    if (file) {
      imageUrl = await arwUploadToCloudinary(file);
    }

    const res = await fetch(ARW_API + "/reviews", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        name,
        text,
        rating: ARW_SELECTED_RATING,
        image: imageUrl,
        businessId: BUSINESS_ID
      })
    });

    if (!res.ok) {
      const err = await res.text();
      alert("Error: " + err);
      btn.disabled = false;
      btn.textContent = "Submit Review";
      return;
    }

    alert("Review submitted! Awaiting approval.");

    document.getElementById("arw-name").value = "";
    document.getElementById("arw-text").value = "";
    document.getElementById("arw-image").value = "";
    arwSetRating(0);
    arwLoadReviews();
  } catch (e) {
    alert("Error: " + (e.message || "Submission failed"));
  }

  btn.disabled = false;
  btn.textContent = "Submit Review";
}

async function arwLoadReviews() {
  try {
    const res = await fetch(ARW_API + "/reviews?businessId=" + encodeURIComponent(BUSINESS_ID));
    const data = await res.json();

    const approved = Array.isArray(data) ? data.filter(r => r.approved === true) : [];
    ARW_ALL_REVIEWS = approved;
    const list = document.getElementById("arw-list");

    if (!approved.length) {
      document.getElementById("arw-average-number").textContent = "0.0";
      document.getElementById("arw-average-stars").textContent = "☆☆☆☆☆";
      document.getElementById("arw-review-count").textContent = "0 reviews";
      list.innerHTML = `<div class="arw-empty">No approved reviews yet.</div>`;
      return;
    }

    const total = approved.length;
    const avg = approved.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / total;

    document.getElementById("arw-average-number").textContent = avg.toFixed(1);
    document.getElementById("arw-average-stars").textContent = arwRenderAverageStars(avg);
    document.getElementById("arw-review-count").textContent = total === 1 ? "1 review" : total + " reviews";

    list.innerHTML = approved.map(r => `
      <div class="arw-review">
        <div class="arw-review-top">
          <div class="arw-review-name">${r.name || "Anonymous"}</div>
          ${arwNormalizeSource(r) === "google" ? `<div class="arw-source-badge">Verified Google Review</div>` : ``}
        </div>
        <div class="arw-stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</div>
        <div class="arw-review-text">${r.text || ""}</div>
        ${r.image ? `<img src="${r.image}" alt="Review image">` : ""}
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("arw-average-number").textContent = "0.0";
    document.getElementById("arw-average-stars").textContent = "☆☆☆☆☆";
    document.getElementById("arw-review-count").textContent = "Unable to load";
    document.getElementById("arw-list").innerHTML = `<div class="arw-empty">Unable to load reviews right now.</div>`;
  }
}

arwMountWidget();
arwLoadReviews();
</script>

</body>
</html>
