<!DOCTYPE html>
<html>
<head>
  <title>Reset Password - AppLogix</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { margin: 0; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%); color: #1f2937; }
    .wrap { max-width: 560px; margin: 40px auto; padding: 18px; }
    .card { background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 18px 40px rgba(15,23,42,.10); border: 1px solid #e5eefc; }
    .title { font-size: 28px; font-weight: 800; margin: 0 0 10px; }
    .sub { color: #64748b; font-size: 14px; margin-bottom: 16px; }
    .input { width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 16px; border: 1px solid #cfdcf3; background: #f9fbff; font-size: 16px; margin-bottom: 12px; }
    .btn { border: none; border-radius: 16px; padding: 13px 16px; font-size: 15px; font-weight: 800; cursor: pointer; width: 100%; background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); color: #fff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Reset Password</div>
      <div class="sub">Enter a new password for your AppLogix dashboard.</div>
      <input id="pw1" class="input" type="password" placeholder="New password" />
      <input id="pw2" class="input" type="password" placeholder="Confirm new password" />
      <button class="btn" onclick="savePassword()">Save Password</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    let supabaseClient;

    async function initClient() {
      const cfgRes = await fetch("/client-config");
      const cfg = await cfgRes.json();
      supabaseClient = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }

    async function savePassword() {
      const pw1 = document.getElementById("pw1").value;
      const pw2 = document.getElementById("pw2").value;

      if (!pw1 || !pw2) {
        alert("Enter your new password twice.");
        return;
      }

      if (pw1 !== pw2) {
        alert("Passwords do not match.");
        return;
      }

      const { error } = await supabaseClient.auth.updateUser({ password: pw1 });
      if (error) {
        alert("Reset failed: " + error.message);
        return;
      }

      alert("Password updated. You can now log in.");
      window.location.href = "/admin";
    }

    initClient();
  </script>
</body>
</html>
