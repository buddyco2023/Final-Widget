<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      color: #1f2937;
      margin: 0;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      border: 1px solid #e4eefc;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #cfdcf3;
      background: #f9fbff;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-orange { background: #f59e0b; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-gray { background: #64748b; color: white; }

    .hidden { display: none; }

    .status-box {
      margin-top: 10px;
      font-size: 14px;
      color: #475569;
      white-space: pre-wrap;
    }

    .review {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e4eefc;
    }

    .review-name { font-weight: 800; }
    .review-text { margin-top: 8px; }

    .btn-row {
      margin-top: 10px;
      display: grid;
      gap: 6px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">
        <div class="brand-row">
          <h1 class="brand-name">AppLogix Admin</h1>
          <button id="logoutBtn" class="btn btn-gray hidden" onclick="logout()">Logout</button>
        </div>

        <div class="card" id="loginCard">
          <input id="email" class="input" placeholder="Email">
          <input id="password" class="input" type="password" placeholder="Password">
          <button class="btn btn-blue" onclick="login()">Login</button>
          <div id="status" class="status-box"></div>
        </div>

        <div class="card hidden" id="dashboard">
          <div id="businessLabel"></div>
          <button class="btn btn-blue" onclick="loadReviews()">Refresh</button>
        </div>

        <div class="card hidden" id="premiumInviteCard">
          <h3>Send Review Link</h3>
          <input id="reviewerName" class="input" placeholder="Name (optional)">
          <input id="reviewerEmail" class="input" placeholder="Email">
          <button class="btn btn-blue" onclick="sendInvite()">Send</button>
          <div id="inviteStatus" class="status-box"></div>
        </div>

        <div id="reviews"></div>

      </div>
    </div>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

let supabase;
let session;
let businessId;
let planTier;

async function init(){
  const res = await fetch("/client-config");
  const cfg = await res.json();
  supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
}

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    document.getElementById("status").textContent = error.message;
    return;
  }

  session = data.session;

  const res = await fetch("/admin-me", {
    method: "POST",
    headers: { "Authorization": "Bearer " + session.access_token }
  });

  const profile = await res.json();

  businessId = profile.businessId;
  planTier = profile.planTier;

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");

  if(planTier === "premium"){
    document.getElementById("premiumInviteCard").classList.remove("hidden");
  }

  loadReviews();
}

window.loadReviews = async function(){
  const res = await fetch("/reviews?businessId=" + businessId);
  const data = await res.json();

  document.getElementById("reviews").innerHTML = data.map(r => `
    <div class="review">
      <div class="review-name">${r.name}</div>
      <div>${"★".repeat(r.rating)}</div>
      <div class="review-text">${r.text}</div>
      <div class="btn-row">
        ${!r.approved ? `<button class="btn btn-green" onclick="approve(${r.id})">Approve</button>` : ""}
        <button class="btn btn-red" onclick="removeReview(${r.id})">Delete</button>
      </div>
    </div>
  `).join("");
}

window.approve = async function(id){
  await fetch("/reviews/"+id,{
    method:"PUT",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({approved:true})
  });
  loadReviews();
}

window.removeReview = async function(id){
  await fetch("/reviews/"+id,{
    method:"DELETE",
    headers:{ "Authorization":"Bearer "+session.access_token }
  });
  loadReviews();
}

window.sendInvite = async function(){
  const email = document.getElementById("reviewerEmail").value;
  const name = document.getElementById("reviewerName").value;

  const res = await fetch("/send-review-link",{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({ reviewerEmail:email, reviewerName:name })
  });

  document.getElementById("inviteStatus").textContent =
    res.ok ? "Sent" : await res.text();
}

window.logout = async function(){
  await supabase.auth.signOut();
  location.reload();
}

init();
</script>
</body>
</html>
