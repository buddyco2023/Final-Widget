<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      color: #1f2937;
      margin: 0;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      border: 1px solid #e4eefc;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #cfdcf3;
      background: #f9fbff;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-gray { background: #64748b; color: white; }
    .btn-orange { background: #f59e0b; color: white; }

    .hidden {
      display: none;
    }

    .status-box {
      margin-top: 10px;
      font-size: 14px;
      color: #475569;
      white-space: pre-wrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #f8fbff;
      border: 1px solid #dbe7fb;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 13px;
      color: #64748b;
    }

    .avg-stars {
      font-size: 22px;
      color: #ffd84d;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .review {
      background: #ffffff;
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e4eefc;
    }

    .review-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .review-stars {
      margin-bottom: 10px;
      font-size: 20px;
      letter-spacing: 2px;
      color: #f59e0b;
    }

    .review-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .review-text {
      line-height: 1.6;
      color: #334155;
      margin-bottom: 10px;
    }

    .review img {
      width: 100%;
      display: block;
      border-radius: 16px;
      margin-top: 12px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
    }

    .btn-row {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .empty {
      border: 1px solid #e4eefc;
      border-radius: 18px;
      padding: 18px;
      color: #64748b;
      background: #fff;
    }

    @media (max-width: 700px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">
        <div class="brand-row">
          <h1 class="brand-name">AppLogix Admin</h1>
          <button id="logoutBtn" class="btn btn-gray hidden" style="width:auto; margin-top:0;" onclick="logout()">Logout</button>
        </div>

        <div class="sub">Business admin dashboard</div>

        <div class="card" id="loginCard">
          <input id="email" class="input" type="text" placeholder="Email">
          <input id="password" class="input" type="password" placeholder="Password">
          <button class="btn btn-blue" onclick="login()">Login</button>
          <div id="status" class="status-box">Loading...</div>
        </div>

        <div class="card hidden" id="resetCard">
          <div class="sub">Set a new password</div>
          <div class="status-box" style="margin-bottom:12px;">
            This account requires a password reset before dashboard access.
          </div>
          <input id="newPassword" class="input" type="password" placeholder="New password">
          <input id="confirmPassword" class="input" type="password" placeholder="Confirm password">
          <button class="btn btn-blue" onclick="saveNewPassword()">Save New Password</button>
          <div id="resetStatus" class="status-box"></div>
        </div>

        <div class="card hidden" id="dashboardCard">
          <div class="sub" id="businessLabel"></div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="totalReviews">0</div>
              <div class="stat-label">Total Reviews</div>
            </div>

            <div class="stat-card">
              <div class="stat-number" id="pendingReviews">0</div>
              <div class="stat-label">Pending Reviews</div>
            </div>

            <div class="stat-card">
              <div class="stat-number" id="averageRating">0.0</div>
              <div class="stat-label">Average Rating</div>
              <div class="avg-stars" id="averageStars">☆☆☆☆☆</div>
            </div>
          </div>

          <button class="btn btn-blue" onclick="loadReviews()">Refresh Reviews</button>
        </div>

        <div class="card hidden" id="premiumInviteCard">
          <div class="sub">Send Review Link</div>
          <input id="reviewerName" class="input" placeholder="Name (optional)">
          <input id="reviewerEmail" class="input" placeholder="Email">
          <button class="btn btn-blue" onclick="sendInvite()">Send Email</button>
          <div id="inviteStatus" class="status-box"></div>
        </div>

        <div id="reviews"></div>
      </div>
    </div>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

let supabase = null;
let session = null;
let businessId = null;
let planTier = null;

function setStatus(message) {
  document.getElementById("status").textContent = message;
}

function stars(n) {
  const val = Math.max(0, Math.min(5, Number(n) || 0));
  return "★".repeat(val) + "☆".repeat(5 - val);
}

function avgStars(avg) {
  const rounded = Math.round(Number(avg) || 0);
  return "★".repeat(rounded) + "☆".repeat(5 - rounded);
}

async function init() {
  try {
    setStatus("Loading config...");

    const res = await fetch("/client-config", { cache: "no-store" });
    if (!res.ok) {
      throw new Error("Could not load client config");
    }

    const cfg = await res.json();

    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
      throw new Error("Missing Supabase config");
    }

    if (cfg.supabaseUrl === "REPLACE_ME" || cfg.supabaseAnonKey === "REPLACE_ME") {
      throw new Error("Supabase config is still set to REPLACE_ME in the server environment.");
    }

    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    setStatus("Ready.");

    document.getElementById("password").addEventListener("keydown", function (e) {
      if (e.key === "Enter") login();
    });
  } catch (err) {
    console.error("init error:", err);
    setStatus("Init error: " + (err.message || "Unknown error"));
  }
}

window.login = async function () {
  try {
    if (!supabase) {
      setStatus("Supabase is not initialized.");
      return;
    }

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!email || !password) {
      setStatus("Enter your email and password.");
      return;
    }

    setStatus("Logging in...");

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      setStatus("Login error: " + error.message);
      return;
    }

    if (!data || !data.session) {
      setStatus("Login failed: no session returned.");
      return;
    }

    session = data.session;
    await loadProfile();
  } catch (err) {
    console.error("login error:", err);
    setStatus("Login exception: " + (err.message || "Unknown error"));
  }
};

async function loadProfile() {
  try {
    setStatus("Loading profile...");

    const res = await fetch("/admin-me", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + session.access_token
      }
    });

    if (!res.ok) {
      const txt = await res.text();
      setStatus("Profile error: " + txt);
      return;
    }

    const profile = await res.json();

    businessId = profile.businessId;
    planTier = (profile.planTier || "").toLowerCase();

    document.getElementById("loginCard").classList.add("hidden");
    document.getElementById("logoutBtn").classList.remove("hidden");

    if (profile.mustResetPassword) {
      document.getElementById("resetCard").classList.remove("hidden");
      document.getElementById("dashboardCard").classList.add("hidden");
      document.getElementById("premiumInviteCard").classList.add("hidden");
      document.getElementById("reviews").innerHTML = "";
      return;
    }

    document.getElementById("resetCard").classList.add("hidden");
    document.getElementById("dashboardCard").classList.remove("hidden");
    document.getElementById("businessLabel").textContent =
      "Business ID: " + businessId + " | Plan: " + planTier;

    if (planTier === "premium") {
      document.getElementById("premiumInviteCard").classList.remove("hidden");
    } else {
      document.getElementById("premiumInviteCard").classList.add("hidden");
    }

    await loadReviews();
  } catch (err) {
    console.error("loadProfile error:", err);
    setStatus("Profile exception: " + (err.message || "Unknown error"));
  }
}

window.saveNewPassword = async function () {
  try {
    const pw1 = document.getElementById("newPassword").value;
    const pw2 = document.getElementById("confirmPassword").value;
    const resetStatus = document.getElementById("resetStatus");

    if (!pw1 || !pw2) {
      resetStatus.textContent = "Please enter the new password twice.";
      return;
    }

    if (pw1 !== pw2) {
      resetStatus.textContent = "Passwords do not match.";
      return;
    }

    resetStatus.textContent = "Saving...";

    const { error } = await supabase.auth.updateUser({ password: pw1 });

    if (error) {
      resetStatus.textContent = "Password update error: " + error.message;
      return;
    }

    const markRes = await fetch("/admin-mark-password-reset-complete", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + session.access_token
      }
    });

    if (!markRes.ok) {
      resetStatus.textContent = "Server error: " + await markRes.text();
      return;
    }

    resetStatus.textContent = "Password saved. Please log in again.";

    setTimeout(async () => {
      await logout();
    }, 1200);
  } catch (err) {
    console.error("saveNewPassword error:", err);
    document.getElementById("resetStatus").textContent =
      "Password reset exception: " + (err.message || "Unknown error");
  }
};

window.loadReviews = async function () {
  try {
    if (!businessId) return;

    const res = await fetch("/reviews?businessId=" + encodeURIComponent(businessId), {
      cache: "no-store"
    });

    if (!res.ok) {
      document.getElementById("reviews").innerHTML =
        '<div class="empty">Could not load reviews.</div>';
      return;
    }

    const data = await res.json();

    const total = Array.isArray(data) ? data.length : 0;
    const pending = Array.isArray(data) ? data.filter(r => !r.approved).length : 0;
    const avg = total
      ? data.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / total
      : 0;

    document.getElementById("totalReviews").textContent = total;
    document.getElementById("pendingReviews").textContent = pending;
    document.getElementById("averageRating").textContent = avg.toFixed(1);
    document.getElementById("averageStars").textContent = avgStars(avg);

    const reviewsEl = document.getElementById("reviews");

    if (!Array.isArray(data) || !data.length) {
      reviewsEl.innerHTML = '<div class="empty">No reviews found.</div>';
      return;
    }

    reviewsEl.innerHTML = data.map(r => `
      <div class="review">
        <div class="review-name">${r.name || "Anonymous"}</div>
        <div class="review-stars">${stars(r.rating)}</div>
        <div class="review-status ${r.approved ? "status-approved" : "status-pending"}">
          ${r.approved ? "Approved" : "Pending"}
        </div>
        <div class="review-text">${r.text || ""}</div>
        ${r.image ? `<img src="${r.image}" alt="Review image">` : ""}
        <div class="btn-row">
          ${!r.approved ? `<button class="btn btn-green" onclick="approveReview(${r.id})">Approve</button>` : ""}
          ${r.approved ? `<button class="btn btn-orange" onclick="markPending(${r.id})">Mark Pending</button>` : ""}
          <button class="btn btn-red" onclick="removeReview(${r.id})">Delete</button>
        </div>
      </div>
    `).join("");
  } catch (err) {
    console.error("loadReviews error:", err);
    document.getElementById("reviews").innerHTML =
      '<div class="empty">Review load exception.</div>';
  }
};

window.approveReview = async function (id) {
  await fetch("/reviews/" + id, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + session.access_token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ approved: true })
  });

  await loadReviews();
};

window.markPending = async function (id) {
  await fetch("/reviews/" + id, {
    method: "PUT",
    headers: {
      "Authorization": "Bearer " + session.access_token,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ approved: false })
  });

  await loadReviews();
};

window.removeReview = async function (id) {
  await fetch("/reviews/" + id, {
    method: "DELETE",
    headers: {
      "Authorization": "Bearer " + session.access_token
    }
  });

  await loadReviews();
};

window.sendInvite = async function () {
  try {
    const reviewerEmail = document.getElementById("reviewerEmail").value.trim();
    const reviewerName = document.getElementById("reviewerName").value.trim();
    const inviteStatus = document.getElementById("inviteStatus");

    if (!reviewerEmail) {
      inviteStatus.textContent = "Reviewer email is required.";
      return;
    }

    inviteStatus.textContent = "Sending...";

    const res = await fetch("/send-review-link", {
      method: "POST",
      headers: {
        "Authorization": "Bearer " + session.access_token,
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        reviewerEmail,
        reviewerName
      })
    });

    if (!res.ok) {
      inviteStatus.textContent = await res.text();
      return;
    }

    inviteStatus.textContent = "Email sent successfully.";
    document.getElementById("reviewerEmail").value = "";
    document.getElementById("reviewerName").value = "";
  } catch (err) {
    console.error("sendInvite error:", err);
    document.getElementById("inviteStatus").textContent =
      "Invite exception
