<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-name {
      font-size: 28px;
      font-weight: 800;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 18px;
      border: 1px solid #e4eefc;
      margin-top: 14px;
    }

    .input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #cfdcf3;
      margin-bottom: 10px;
      box-sizing: border-box;
    }

    .btn {
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 6px;
    }

    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-gray { background: #64748b; color: white; }

    .review {
      border: 1px solid #e4eefc;
      border-radius: 14px;
      padding: 12px;
      margin-top: 12px;
    }

    .hidden { display: none; }

    .status { font-size: 14px; margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">

        <div class="brand-row">
          <div class="brand-name">AppLogix Admin</div>
          <button id="logoutBtn" class="btn btn-gray hidden" onclick="logout()">Logout</button>
        </div>

        <div id="loginCard" class="card">
          <input id="email" class="input" placeholder="Email">
          <input id="password" class="input" type="password" placeholder="Password">
          <button class="btn btn-blue" onclick="login()">Login</button>
          <div id="status" class="status"></div>
        </div>

        <div id="dashboard" class="hidden">

          <div class="card">
            <div id="businessLabel"></div>
            <button class="btn btn-blue" onclick="loadReviews()">Refresh Reviews</button>
          </div>

          <div id="premiumCard" class="card hidden">
            <h3>Send Review Link</h3>
            <input id="reviewerName" class="input" placeholder="Name (optional)">
            <input id="reviewerEmail" class="input" placeholder="Email">
            <button class="btn btn-blue" onclick="sendInvite()">Send Email</button>
            <div id="inviteStatus" class="status"></div>
          </div>

          <div id="reviews"></div>

        </div>

      </div>
    </div>
  </div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

let supabase;
let session;
let businessId;
let planTier;

async function init(){
  const res = await fetch("/client-config");
  const cfg = await res.json();
  supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
}

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    document.getElementById("status").textContent = error.message;
    return;
  }

  session = data.session;

  const res = await fetch("/admin-me", {
    method: "POST",
    headers: { "Authorization": "Bearer " + session.access_token }
  });

  if(!res.ok){
    document.getElementById("status").textContent = await res.text();
    return;
  }

  const profile = await res.json();

  businessId = profile.businessId;
  planTier = profile.planTier;

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("logoutBtn").classList.remove("hidden");

  document.getElementById("businessLabel").textContent =
    "Business ID: " + businessId + " | Plan: " + planTier;

  if(planTier === "premium"){
    document.getElementById("premiumCard").classList.remove("hidden");
  }

  loadReviews();
};

window.loadReviews = async function(){
  const res = await fetch("/reviews?businessId=" + encodeURIComponent(businessId));
  const data = await res.json();

  document.getElementById("reviews").innerHTML = data.map(r => `
    <div class="review">
      <strong>${r.name || "Anonymous"}</strong><br/>
      ${"★".repeat(Number(r.rating) || 0)}<br/>
      ${r.text || ""}
      <div>
        ${!r.approved ? `<button class="btn btn-green" onclick="approve(${r.id})">Approve</button>` : ""}
        <button class="btn btn-red" onclick="removeReview(${r.id})">Delete</button>
      </div>
    </div>
  `).join("");
};

window.approve = async function(id){
  await fetch("/reviews/"+id,{
    method:"PUT",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({approved:true})
  });
  loadReviews();
};

window.removeReview = async function(id){
  await fetch("/reviews/"+id,{
    method:"DELETE",
    headers:{ "Authorization":"Bearer "+session.access_token }
  });
  loadReviews();
};

window.sendInvite = async function(){
  const email = document.getElementById("reviewerEmail").value;
  const name = document.getElementById("reviewerName").value;

  const res = await fetch("/send-review-link",{
    method:"POST",
    headers:{
      "Authorization":"Bearer "+session.access_token,
      "Content-Type":"application/json"
    },
    body:JSON.stringify({ reviewerEmail:email, reviewerName:name })
  });

  document.getElementById("inviteStatus").textContent =
    res.ok ? "Email sent successfully" : await res.text();
};

window.logout = async function(){
  await supabase.auth.signOut();
  location.reload();
};

init();
</script>

</body>
</html>
