<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(#eef5ff, #ffffff);
      color: #1f2937;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    .hidden { display: none; }

    .status {
      margin-top: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <div class="card" id="loginCard">
    <h2>AppLogix Admin</h2>

    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Login</button>

    <div id="status" class="status">Starting...</div>
  </div>

  <div class="card hidden" id="dashboard">
    <h2>Dashboard</h2>
    <button onclick="logout()">Logout</button>
    <div id="reviews"></div>
  </div>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

let supabase;
let session;
let businessId;

const status = document.getElementById("status");

function setStatus(msg){
  status.textContent = msg;
}

async function init(){
  try{
    setStatus("Loading config...");

    const res = await fetch("/client-config?ts=" + Date.now());
    const cfg = await res.json();

    supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    setStatus("Ready.");

  }catch(err){
    setStatus("Error: " + err.message);
  }
}

window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  setStatus("Logging in...");

  const { data, error } = await supabase.auth.signInWithPassword({ email, password });

  if(error){
    setStatus(error.message);
    return;
  }

  session = data.session;

  const res = await fetch("/admin-me", {
    method:"POST",
    headers:{
      "Authorization":"Bearer "+session.access_token
    }
  });

  const profile = await res.json();

  businessId = profile.businessId;

  document.getElementById("loginCard").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");

  loadReviews();
}

async function loadReviews(){
  const res = await fetch("/reviews?businessId="+businessId);
  const data = await res.json();

  document.getElementById("reviews").innerHTML = data.map(r => `
    <div>
      <strong>${r.name}</strong> (${r.rating})
      <br>${r.text}
    </div>
  `).join("");
}

window.logout = async function(){
  await supabase.auth.signOut();
  location.reload();
}

init();
</script>

</body>
</html>
