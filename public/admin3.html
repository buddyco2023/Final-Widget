<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #1f2937;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid #dbe7fb;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.08);
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    .sub {
      color: #64748b;
      margin-bottom: 16px;
    }
    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #cfdcf3;
      margin-bottom: 12px;
      font-size: 16px;
    }
    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      background: #2563eb;
      color: white;
      margin-top: 6px;
    }
    .btn.gray {
      background: #64748b;
    }
    .btn.green {
      background: #16a34a;
    }
    .btn.orange {
      background: #f59e0b;
    }
    .btn.red {
      background: #dc2626;
    }
    .status {
      margin-top: 12px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .hidden {
      display: none;
    }
    .review {
      border: 1px solid #dbe7fb;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      background: white;
    }
    .review strong {
      display: block;
      margin-bottom: 6px;
      font-size: 18px;
    }
    .review-stars {
      color: #f59e0b;
      font-size: 20px;
      margin-bottom: 8px;
    }
    .review-status {
      display: inline-block;
      margin-bottom: 10px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-approved {
      background: #dcfce7;
      color: #166534;
    }
    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }
    .review-text {
      margin-bottom: 12px;
      line-height: 1.5;
    }
    .review-image {
      width: 100%;
      border-radius: 14px;
      display: block;
      margin: 10px 0 14px;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.12);
    }
    .review-actions {
      display: grid;
      gap: 8px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: #f8fbff;
      border: 1px solid #dbe7fb;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }
    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 4px;
    }
    .stat-label {
      font-size: 13px;
      color: #64748b;
    }
    @media (max-width: 700px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">AppLogix Admin</div>
      <div class="sub">Business dashboard</div>
      <button id="logoutBtn" class="btn gray hidden" onclick="logout()">Logout</button>
    </div>

    <div id="loginCard" class="card">
      <input id="email" class="input" type="email" placeholder="Email" />
      <input id="password" class="input" type="password" placeholder="Password" />
      <button class="btn" onclick="login()">Login</button>
      <div id="status" class="status">Starting admin dashboard...</div>
    </div>

    <div id="resetCard" class="card hidden">
      <div class="sub">This account requires a password reset.</div>
      <input id="newPassword" class="input" type="password" placeholder="New password" />
      <input id="confirmPassword" class="input" type="password" placeholder="Confirm password" />
      <button class="btn" onclick="saveNewPassword()">Save New Password</button>
      <div id="resetStatus" class="status"></div>
    </div>

    <div id="dashboardCard" class="card hidden">
      <div id="businessLabel" class="sub"></div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-number" id="totalReviews">0</div>
          <div class="stat-label">Total Reviews</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="pendingReviews">0</div>
          <div class="stat-label">Pending Reviews</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="averageRating">0.0</div>
          <div class="stat-label">Average Rating</div>
        </div>
      </div>

      <button class="btn" onclick="loadReviews()">Refresh Reviews</button>
    </div>

    <div id="premiumInviteCard" class="card hidden">
      <div class="sub">Send Review Link</div>
      <input id="reviewerName" class="input" placeholder="Name (optional)" />
      <input id="reviewerEmail" class="input" placeholder="Email" />
      <button class="btn" onclick="sendInvite()">Send Email</button>
      <div id="inviteStatus" class="status"></div>
    </div>

    <div id="reviews"></div>
  </div>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    let supabase = null;
    let session = null;
    let businessId = null;
    let planTier = null;

    function setStatus(message) {
      document.getElementById("status").textContent = message;
      console.log(message);
    }

    function stars(n) {
      const val = Math.max(0, Math.min(5, Number(n) || 0));
      return "★".repeat(val) + "☆".repeat(5 - val);
    }

    async function init() {
      try {
        setStatus("Loading /client-config ...");

        const res = await fetch("/client-config", { cache: "no-store" });
        if (!res.ok) {
          throw new Error("client-config request failed with status " + res.status);
        }

        const cfg = await res.json();
        console.log("client-config:", cfg);

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
          throw new Error("Missing supabase config values");
        }

        if (cfg.supabaseUrl === "REPLACE_ME" || cfg.supabaseAnonKey === "REPLACE_ME") {
          throw new Error("Supabase environment values are still REPLACE_ME");
        }

        supabase = createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
        setStatus("Ready. Enter login.");

        document.getElementById("password").addEventListener("keydown", function (e) {
          if (e.key === "Enter") login();
        });
      } catch (err) {
        console.error("init error:", err);
        setStatus("Init failed: " + (err.message || "Unknown error"));
      }
    }

    window.login = async function () {
      try {
        if (!supabase) {
          setStatus("Supabase is not initialized.");
          return;
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value.trim();

        if (!email || !password) {
          setStatus("Enter email and password.");
          return;
        }

        setStatus("Signing in...");

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          setStatus("Login error: " + error.message);
          return;
        }

        if (!data || !data.session) {
          setStatus("Login failed: no session returned.");
          return;
        }

        session = data.session;
        setStatus("Login successful. Loading profile...");
        await loadProfile();
      } catch (err) {
        console.error("login error:", err);
        setStatus("Login exception: " + (err.message || "Unknown error"));
      }
    };

    async function loadProfile() {
      try {
        const res = await fetch("/admin-me", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + session.access_token
          }
        });

        const text = await res.text();
        console.log("/admin-me raw:", text);

        if (!res.ok) {
          setStatus("Profile error: " + text);
          return;
        }

        const profile = JSON.parse(text);
        businessId = profile.businessId;
        planTier = (profile.planTier || "").toLowerCase();

        document.getElementById("loginCard").classList.add("hidden");
        document.getElementById("logoutBtn").classList.remove("hidden");

        if (profile.mustResetPassword) {
          document.getElementById("resetCard").classList.remove("hidden");
          setStatus("Password reset required.");
          return;
        }

        document.getElementById("dashboardCard").classList.remove("hidden");
        document.getElementById("businessLabel").textContent =
          "Business ID: " + businessId + " | Plan: " + planTier;

        if (planTier === "premium") {
          document.getElementById("premiumInviteCard").classList.remove("hidden");
        }

        await loadReviews();
      } catch (err) {
        console.error("loadProfile error:", err);
        setStatus("Profile exception: " + (err.message || "Unknown error"));
      }
    }

    window.saveNewPassword = async function () {
      try {
        const pw1 = document.getElementById("newPassword").value;
        const pw2 = document.getElementById("confirmPassword").value;
        const resetStatus = document.getElementById("resetStatus");

        if (!pw1 || !pw2) {
          resetStatus.textContent = "Enter the new password twice.";
          return;
        }

        if (pw1 !== pw2) {
          resetStatus.textContent = "Passwords do not match.";
          return;
        }

        resetStatus.textContent = "Saving password...";

        const { error } = await supabase.auth.updateUser({ password: pw1 });
        if (error) {
          resetStatus.textContent = "Update error: " + error.message;
          return;
        }

        const res = await fetch("/admin-mark-password-reset-complete", {
          method: "POST",
          headers: {
            "Authorization": "Bearer " + session.access_token
          }
        });

        if (!res.ok) {
          resetStatus.textContent = await res.text();
          return;
        }

        resetStatus.textContent = "Password saved. Please log in again.";
        setTimeout(async () => {
          await logout();
        }, 1200);
      } catch (err) {
        console.error("saveNewPassword error:", err);
        document.getElementById("resetStatus").textContent =
          "Reset exception: " + (err.message || "Unknown error");
      }
    };

    window.loadReviews = async function () {
      if (!businessId) return;

      const res = await fetch("/reviews?businessId=" + encodeURIComponent(businessId), {
        cache: "no-store"
      });

      if (!res.ok) {
        document.getElementById("reviews").innerHTML = "<div class='card'>Could not load reviews.</div>";
        return;
      }

      const data = await res.json();

      const total = Array.isArray(data) ? data.length : 0;
      const pending = Array.isArray(data) ? data.filter(r => !r.approved).length : 0;
      const avg = total
        ? data.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / total
        : 0;

      document.getElementById("totalReviews").textContent = total;
      document.getElementById("pendingReviews").textContent = pending;
      document.getElementById("averageRating").textContent = avg.toFixed(1);

      if (!Array.isArray(data) || !data.length) {
        document.getElementById("reviews").innerHTML = "<div class='card'>No reviews found.</div>";
        return;
      }

      document.getElementById("reviews").innerHTML = data.map(r => `
        <div class="review">
          <strong>${r.name || "Anonymous"}</strong>
          <div class="review-stars">${stars(r.rating)}</div>
          <div class="review-status ${r.approved ? "status-approved" : "status-pending"}">
            ${r.approved ? "Approved" : "Pending"}
          </div>
          <div class="review-text">${r.text || ""}</div>
          ${r.image ? `<img class="review-image" src="${r.image}" alt="Submitted review image" />` : ""}
          <div class="review-actions">
            ${!r.approved ? `<button class="btn green" onclick="approveReview(${r.id})">Approve</button>` : ""}
            ${r.approved ? `<button class="btn orange" onclick="markPending(${r.id})">Mark Pending</button>` : ""}
            <button class="btn red" onclick="removeReview(${r.id})">Delete</button>
          </div>
        </div>
      `).join("");
    };

    window.approveReview = async function (id) {
      await fetch("/reviews/" + id, {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ approved: true })
      });
      await loadReviews();
    };

    window.markPending = async function (id) {
      await fetch("/reviews/" + id, {
        method: "PUT",
        headers: {
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ approved: false })
      });
      await loadReviews();
    };

    window.removeReview = async function (id) {
      await fetch("/reviews/" + id, {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });
      await loadReviews();
    };

    window.sendInvite = async function () {
      const reviewerEmail = document.getElementById("reviewerEmail").value.trim();
      const reviewerName = document.getElementById("reviewerName").value.trim();
      const inviteStatus = document.getElementById("inviteStatus");

      if (!reviewerEmail) {
        inviteStatus.textContent = "Reviewer email is required.";
        return;
      }

      inviteStatus.textContent = "Sending...";

      const res = await fetch("/send-review-link", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + session.access_token,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          reviewerEmail,
          reviewerName
        })
      });

      inviteStatus.textContent = res.ok ? "Email sent successfully." : await res.text();
    };

    window.logout = async function () {
      try {
        if (supabase) {
          await supabase.auth.signOut();
        }
      } catch (_) {}
      location.reload();
    };

    init();
  </script>
</body>
</html>
