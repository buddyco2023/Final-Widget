<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      color: #1f2937;
      margin: 0;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      border: 1px solid #e4eefc;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #cfdcf3;
      background: #f9fbff;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-red { background: #dc2626; color: white; }
    .btn-gray { background: #64748b; color: white; }

    .hidden { display: none; }

    .status-box {
      margin-top: 10px;
      font-size: 14px;
      color: #475569;
      white-space: pre-wrap;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background: #f8fbff;
      border: 1px solid #dbe7fb;
      border-radius: 18px;
      padding: 16px;
      text-align: center;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 6px;
    }

    .stat-label {
      font-size: 13px;
      color: #64748b;
    }

    .avg-stars {
      font-size: 22px;
      color: #ffd84d;
      letter-spacing: 2px;
      margin-top: 4px;
    }

    .review {
      background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e4eefc;
    }

    .review-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .review-stars {
      margin-bottom: 10px;
      font-size: 22px;
      letter-spacing: 2px;
      color: #ffd84d;
    }

    .review-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .review-text {
      line-height: 1.6;
      color: #334155;
    }

    .review img {
      width: 100%;
      display: block;
      border-radius: 16px;
      margin-top: 12px;
    }

    .empty {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      color: #64748b;
      text-align: center;
      border: 1px solid #e5eefc;
    }

    @media (max-width: 700px) {
      .stats-grid {
        grid-template-columns: 1fr;
      }

      .brand-row {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">
        <div class="brand-row">
          <h1 class="brand-name">AppLogix</h1>
          <button id="logoutBtn" class="btn btn-gray hidden" style="width:auto; margin-top:0;" onclick="logout()">Logout</button>
        </div>

        <div class="sub">Business admin dashboard</div>

        <div class="card" id="loginCard">
          <input id="email" class="input" type="text" placeholder="Email" />
          <input id="password" class="input" type="password" placeholder="Password" />
          <button id="loginBtn" class="btn btn-blue" onclick="adminLogin()">Login</button>
          <div id="loginStatus" class="status-box">Loading login system...</div>
        </div>

        <div class="card hidden" id="resetCard">
          <div class="sub">Set a new password</div>
          <input id="newPassword" class="input" type="password" placeholder="New password" />
          <input id="confirmPassword" class="input" type="password" placeholder="Confirm password" />
          <button class="btn btn-blue" onclick="resetPassword()">Save</button>
          <div id="resetStatus" class="status-box"></div>
        </div>

        <div class="card hidden" id="dashboard">
          <div class="sub" id="businessIdLabel"></div>

          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-number" id="totalReviews">0</div>
              <div class="stat-label">Total Reviews</div>
            </div>

            <div class="stat-card">
              <div class="stat-number" id="pendingReviews">0</div>
              <div class="stat-label">Pending Reviews</div>
            </div>

            <div class="stat-card">
              <div class="stat-number" id="averageRating">0.0</div>
              <div class="stat-label">Average Rating</div>
              <div class="avg-stars" id="averageStars">☆☆☆☆☆</div>
            </div>
          </div>

          <button class="btn btn-blue" onclick="loadReviews()">Refresh</button>
        </div>

        <div id="reviews"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    let supabase = null;
    let session = null;
    let businessId = null;

    function setLoginStatus(message) {
      document.getElementById("loginStatus").textContent = message;
    }

    async function init() {
      try {
        const loginBtn = document.getElementById("loginBtn");
        loginBtn.disabled = true;
        setLoginStatus("Loading login system...");

        if (!window.supabase || !window.supabase.createClient) {
          throw new Error("Supabase library did not load");
        }

        const res = await fetch("/client-config?ts=" + Date.now(), { cache: "no-store" });

        if (!res.ok) {
          throw new Error("Could not load /client-config");
        }

        const cfg = await res.json();

        if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
          throw new Error("Supabase config missing from /client-config");
        }

        supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

        loginBtn.disabled = false;
        setLoginStatus("Ready.");

        document.getElementById("password").addEventListener("keydown", function(e) {
          if (e.key === "Enter") {
            adminLogin();
          }
        });
      } catch (err) {
        console.error("INIT ERROR:", err);
        setLoginStatus("Login system failed to load.\n" + err.message);
      }
    }

    async function adminLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();
      const loginBtn = document.getElementById("loginBtn");

      if (!supabase) {
        setLoginStatus("Login system is not ready.");
        return;
      }

      if (!email || !password) {
        setLoginStatus("Enter your email and password.");
        return;
      }

      try {
        loginBtn.disabled = true;
        setLoginStatus("Signing in...");

        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          setLoginStatus("Login failed: " + error.message);
          loginBtn.disabled = false;
          return;
        }

        session = data.session;
        setLoginStatus("");
        await loadProfile();
      } catch (err) {
        console.error("LOGIN ERROR:", err);
        setLoginStatus("Login failed: " + err.message);
      } finally {
        loginBtn.disabled = false;
      }
    }

    async function loadProfile() {
      const res = await fetch("/admin-me", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        alert("Profile error: " + err);
        return;
      }

      const data = await res.json();
      businessId = data.businessId;

      document.getElementById("businessIdLabel").textContent = "Business ID: " + businessId;
      document.getElementById("loginCard").classList.add("hidden");
      document.getElementById("logoutBtn").classList.remove("hidden");

      if (data.mustResetPassword) {
        document.getElementById("resetCard").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("reviews").innerHTML = "";
      } else {
        document.getElementById("resetCard").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        await loadReviews();
      }
    }

    async function resetPassword() {
      const pw1 = document.getElementById("newPassword").value;
      const pw2 = document.getElementById("confirmPassword").value;
      const resetStatus = document.getElementById("resetStatus");

      if (!pw1 || !pw2) {
        resetStatus.textContent = "Please enter the new password twice.";
        return;
      }

      if (pw1 !== pw2) {
        resetStatus.textContent = "Passwords do not match.";
        return;
      }

      resetStatus.textContent = "Saving new password...";

      const { error } = await supabase.auth.updateUser({ password: pw1 });

      if (error) {
        resetStatus.textContent = error.message;
        return;
      }

      const res = await fetch("/admin-mark-password-reset-complete", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        resetStatus.textContent = "Could not save password reset status: " + err;
        return;
      }

      resetStatus.textContent = "";
      document.getElementById("resetCard").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      await loadProfile();
    }

    function renderAverageStars(avg) {
      const rounded = Math.round(avg);
      return "★".repeat(rounded) + "☆".repeat(5 - rounded);
    }

    async function loadReviews() {
      const res = await fetch("/reviews?businessId=" + encodeURIComponent(businessId));
      const data = await res.json();
      const el = document.getElementById("reviews");

      if (!Array.isArray(data) || !data.length) {
        document.getElementById("totalReviews").textContent = "0";
        document.getElementById("pendingReviews").textContent = "0";
        document.getElementById("averageRating").textContent = "0.0";
        document.getElementById("averageStars").textContent = "☆☆☆☆☆";
        el.innerHTML = `<div class="empty">No reviews found.</div>`;
        return;
      }

      const total = data.length;
      const pending = data.filter(r => !r.approved).length;
      const avg = data.reduce((sum, r) => sum + (Number(r.rating) || 0), 0) / total;

      document.getElementById("totalReviews").textContent = total;
      document.getElementById("pendingReviews").textContent = pending;
      document.getElementById("averageRating").textContent = avg.toFixed(1);
      document.getElementById("averageStars").textContent = renderAverageStars(avg);

      el.innerHTML = data.map(r => `
        <div class="review">
          <div class="review-name">${r.name || "Anonymous"}</div>
          <div class="review-stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</div>
          <div class="review-status ${r.approved ? "status-approved" : "status-pending"}">
            ${r.approved ? "Approved" : "Pending"}
          </div>
          <div class="review-text">${r.text || ""}</div>
          ${r.image ? `<img src="${r.image}" alt="Review image">` : ""}
          ${!r.approved ? `<button class="btn btn-green" onclick="approve(${r.id})">Approve</button>` : ""}
          <button class="btn btn-red" onclick="del(${r.id})">Delete</button>
        </div>
      `).join("");
    }

    async function approve(id) {
      const res = await fetch("/reviews/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({ approved: true })
      });

      if (!res.ok) {
        const err = await res.text();
        alert(err);
        return;
      }

      await loadReviews();
    }

    async function del(id) {
      const res = await fetch("/reviews/" + id, {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        alert(err);
        return;
      }

      await loadReviews();
    }

    async function logout() {
      if (supabase) {
        await supabase.auth.signOut();
      }

      session = null;
      businessId = null;

      document.getElementById("email").value = "";
      document.getElementById("password").value = "";
      document.getElementById("newPassword").value = "";
      document.getElementById("confirmPassword").value = "";
      document.getElementById("resetStatus").textContent = "";

      document.getElementById("logoutBtn").classList.add("hidden");
      document.getElementById("loginCard").classList.remove("hidden");
      document.getElementById("resetCard").classList.add("hidden");
      document.getElementById("dashboard").classList.add("hidden");
      document.getElementById("reviews").innerHTML = "";
      setLoginStatus("Ready.");
    }

    init();
  </script>
</body>
</html>
