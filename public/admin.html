<!DOCTYPE html>
<html>
<head>
  <title>AppLogix Admin Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="manifest" href="/manifest.json" />

  <style>
    body {
      margin: 0;
      font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(145deg, #eef5ff 0%, #f8fbff 55%, #edf4ff 100%);
      color: #1f2937;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .panel {
      background: #ffffff;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.10);
      border: 1px solid #e5eefc;
    }

    .topbar {
      height: 58px;
      background: linear-gradient(90deg, #4ea3ff 0%, #2156d8 100%);
    }

    .content {
      padding: 20px;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 30px;
      font-weight: 800;
      color: #1f2937;
      margin: 0;
    }

    .sub {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 16px;
    }

    .card {
      background: linear-gradient(180deg, #ffffff 0%, #fbfdff 100%);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.12);
      border: 1px solid #e4eefc;
      margin-bottom: 18px;
    }

    .input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid #cfdcf3;
      background: #f9fbff;
      font-size: 16px;
      color: #1f2937;
      margin-bottom: 12px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
      margin-top: 8px;
    }

    .btn-blue { background: #2563eb; color: white; }
    .btn-green { background: #16a34a; color: white; }
    .btn-orange { background: #f59e0b; color: white; }
    .btn-red { background: #dc2626; color: white; }

    .hidden { display: none; }

    .review {
      background: linear-gradient(180deg, #ffffff 0%, #f9fbff 100%);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid #e4eefc;
    }

    .review-name {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .review-stars {
      margin-bottom: 10px;
      font-size: 22px;
      letter-spacing: 2px;
      color: #ffd84d;
      text-shadow:
        0 1px 0 #fff8cc,
        0 2px 0 #f7c948,
        0 3px 4px rgba(0,0,0,0.18),
        0 0 10px rgba(255,216,77,0.35);
    }

    .review-status {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .status-approved {
      background: #dcfce7;
      color: #166534;
    }

    .status-pending {
      background: #fef3c7;
      color: #92400e;
    }

    .review-text {
      line-height: 1.6;
      color: #334155;
    }

    .review img {
      width: 100%;
      display: block;
      border-radius: 16px;
      margin-top: 12px;
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.14);
    }

    .empty {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      color: #64748b;
      text-align: center;
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      border: 1px solid #e5eefc;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="panel">
      <div class="topbar"></div>

      <div class="content">
        <div class="brand-row">
          <h1 class="brand-name">AppLogix</h1>
        </div>

        <div class="sub">Business admin dashboard</div>

        <div class="card" id="loginCard">
          <input id="email" class="input" type="text" placeholder="Email" />
          <input id="password" class="input" type="password" placeholder="Password" />
          <button class="btn btn-blue" onclick="adminLogin()">Login</button>
        </div>

        <div class="card hidden" id="resetCard">
          <div class="sub">Set a new password</div>
          <input id="newPassword" class="input" type="password" placeholder="New password" />
          <input id="confirmPassword" class="input" type="password" placeholder="Confirm password" />
          <button class="btn btn-blue" onclick="resetPassword()">Save</button>
        </div>

        <div class="card hidden" id="dashboard">
          <button class="btn btn-blue" onclick="loadReviews()">Refresh</button>
        </div>

        <div id="reviews"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    let supabase;
    let session;
    let businessId;

    async function init() {
      const res = await fetch("/client-config");
      const cfg = await res.json();
      supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }

    async function adminLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value.trim();

      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        alert(error.message);
        return;
      }

      session = data.session;
      await loadProfile();
    }

    async function loadProfile() {
      const res = await fetch("/admin-me", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        alert(err);
        return;
      }

      const data = await res.json();
      businessId = data.businessId;

      document.getElementById("loginCard").classList.add("hidden");

      if (data.mustResetPassword) {
        document.getElementById("resetCard").classList.remove("hidden");
        document.getElementById("dashboard").classList.add("hidden");
        document.getElementById("reviews").innerHTML = "";
      } else {
        document.getElementById("resetCard").classList.add("hidden");
        document.getElementById("dashboard").classList.remove("hidden");
        loadReviews();
      }
    }

    async function resetPassword() {
      const pw1 = document.getElementById("newPassword").value;
      const pw2 = document.getElementById("confirmPassword").value;

      if (!pw1 || !pw2) {
        alert("Please enter the new password twice.");
        return;
      }

      if (pw1 !== pw2) {
        alert("Passwords do not match");
        return;
      }

      const { error } = await supabase.auth.updateUser({ password: pw1 });

      if (error) {
        alert(error.message);
        return;
      }

      const res = await fetch("/admin-mark-password-reset-complete", {
        method: "POST",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        alert("Could not save password reset status: " + err);
        return;
      }

      document.getElementById("resetCard").classList.add("hidden");
      document.getElementById("dashboard").classList.remove("hidden");

      await loadProfile();
    }

    async function loadReviews() {
      const res = await fetch("/reviews?businessId=" + encodeURIComponent(businessId));
      const data = await res.json();

      const el = document.getElementById("reviews");

      if (!Array.isArray(data) || !data.length) {
        el.innerHTML = `<div class="empty">No reviews found.</div>`;
        return;
      }

      el.innerHTML = data.map(r => `
        <div class="review">
          <div class="review-name">${r.name || "Anonymous"}</div>
          <div class="review-stars">${"★".repeat(r.rating || 0)}${"☆".repeat(5 - (r.rating || 0))}</div>
          <div class="review-status ${r.approved ? "status-approved" : "status-pending"}">
            ${r.approved ? "Approved" : "Pending"}
          </div>
          <div class="review-text">${r.text || ""}</div>
          ${r.image ? `<img src="${r.image}" alt="Review image">` : ""}
          <button class="btn btn-green" onclick="approve(${r.id})">Approve</button>
          <button class="btn btn-red" onclick="del(${r.id})">Delete</button>
        </div>
      `).join("");
    }

    async function approve(id) {
      const res = await fetch("/reviews/" + id, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + session.access_token
        },
        body: JSON.stringify({ approved: true })
      });

      if (!res.ok) {
        const err = await res.text();
        alert(err);
        return;
      }

      loadReviews();
    }

    async function del(id) {
      const res = await fetch("/reviews/" + id, {
        method: "DELETE",
        headers: {
          "Authorization": "Bearer " + session.access_token
        }
      });

      if (!res.ok) {
        const err = await res.text();
        alert(err);
        return;
      }

      loadReviews();
    }

    init();
  </script>
</body>
</html>
