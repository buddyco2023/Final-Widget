<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AppLogix Billing + Partner Tracker</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef5ff;
      color: #1f2937;
    }
    .wrap {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid #dbe7fb;
      box-shadow: 0 10px 24px rgba(15,23,42,.08);
    }
    .title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 8px;
      color: #1e3a8a;
    }
    .sub {
      color: #64748b;
      margin-bottom: 14px;
    }
    .btn {
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      background: #2563eb;
      color: #fff;
    }
    .btn.green {
      background: #16a34a;
    }
    .btn.light {
      background: #eef4ff;
      color: #1e3a8a;
      border: 1px solid #dbe7fb;
    }
    .status {
      margin-top: 10px;
      font-size: 14px;
      white-space: pre-wrap;
    }
    .table-wrap {
      overflow: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }
    th, td {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: top;
    }
    th {
      color: #1e3a8a;
      background: #f8fbff;
      position: sticky;
      top: 0;
    }
    .pill {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .paid { background: #dcfce7; color: #166534; }
    .active { background: #dbeafe; color: #1d4ed8; }
    .past_due { background: #fee2e2; color: #b91c1c; }
    .paused { background: #e5e7eb; color: #374151; }
    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .input {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #cfdcf3;
      background: #fff;
      font-size: 14px;
    }
    .section-title {
      font-size: 20px;
      font-weight: 800;
      color: #1e3a8a;
      margin-bottom: 12px;
    }
    .payout-card {
      border: 1px solid #dbe7fb;
      border-radius: 14px;
      padding: 16px;
      background: #f8fbff;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Billing + Partner Tracker</div>
      <div class="sub">Track invoice dates, payment status, reminders, and monthly partner payouts.</div>
      <div class="controls">
        <button class="btn" onclick="loadClients()">Refresh</button>
        <button class="btn light" onclick="sendReminders()">Send Billing Reminders</button>
        <button class="btn light" onclick="loadPayoutReport()">Load Partner Payout Report</button>
        <input id="filterInput" class="input" placeholder="Filter by business, plan, or partner" oninput="renderRows()" />
      </div>
      <div id="opsStatus" class="status"></div>
    </div>

    <div class="card">
      <div class="section-title">Client Billing Tracker</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Business</th>
              <th>Plan / Delivery</th>
              <th>Billing</th>
              <th>Next Invoice</th>
              <th>Last Payment</th>
              <th>Partner</th>
              <th>Commission</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>

    <div class="card">
      <div class="section-title">Partner Payout Report</div>
      <div id="payouts"></div>
    </div>
  </div>

  <script>
    let clientRows = [];

    function token() {
      return "1234";
    }

    function money(n) {
      return "$" + Number(n || 0).toFixed(2);
    }

    function pill(status) {
      const safe = String(status || "active").toLowerCase();
      return `<span class="pill ${safe}">${safe.replace("_", " ")}</span>`;
    }

    async function loadClients() {
      const status = document.getElementById("opsStatus");
      status.textContent = "Loading...";

      try {
        const res = await fetch("/ops-clients", {
          headers: { "x-admin-token": token() },
          cache: "no-store"
        });

        if (!res.ok) {
          status.textContent = await res.text();
          return;
        }

        clientRows = await res.json();
        renderRows();
        status.textContent = "Loaded.";
      } catch (err) {
        status.textContent = err.message || "Load failed.";
      }
    }

    function renderRows() {
      const q = document.getElementById("filterInput").value.trim().toLowerCase();

      const rows = clientRows.filter(r => {
        const blob = `${r.businessName} ${r.businessId} ${r.planTier} ${r.deliveryType} ${r.partnerName}`.toLowerCase();
        return !q || blob.includes(q);
      });

      document.getElementById("rows").innerHTML = rows.map(r => `
        <tr>
          <td>
            <strong>${escapeHtml(r.businessName)}</strong><br>
            <span style="color:#64748b">${escapeHtml(r.businessId)}</span><br>
            <span style="color:#64748b">${escapeHtml(r.email || "")}</span>
          </td>
          <td>
            <strong>${escapeHtml((r.planTier || "").toUpperCase())}</strong><br>
            <span style="color:#64748b">${escapeHtml((r.deliveryType || "").toUpperCase())}</span>
          </td>
          <td>
            Base: ${money(r.baseMonthlyPrice)}<br>
            Hosted: ${money(r.hostedAddonPrice)}<br>
            <strong>Total: ${money(r.totalMonthlyPrice)}</strong><br>
            Setup: ${money(r.setupFeeAmount)}<br>
            ${pill(r.billingStatus)}
          </td>
          <td>
            ${escapeHtml(r.nextInvoiceDate || "")}<br>
            <span style="color:#64748b">Day ${Number(r.billingDay || 1)}</span><br>
            <span style="color:#64748b">${typeof r.daysUntilInvoice === "number" ? `${r.daysUntilInvoice} day(s)` : ""}</span>
          </td>
          <td>${escapeHtml(r.lastPaymentDate || "—")}</td>
          <td>
            ${escapeHtml(r.partnerName || "—")}<br>
            <span style="color:#64748b">${escapeHtml(r.partnerEmail || "")}</span>
          </td>
          <td>
            ${Number(r.partnerCommissionPercent || 0).toFixed(2)}%<br>
            <strong>${money(r.partnerMonthlyCommission)}</strong>
          </td>
          <td>
            <button class="btn green" onclick="recordPayment('${escapeJs(r.businessId)}')">Record Payment</button>
          </td>
        </tr>
      `).join("");
    }

    async function recordPayment(businessId) {
      const paidDate = prompt("Enter payment date (YYYY-MM-DD)", new Date().toISOString().slice(0, 10));
      if (!paidDate) return;

      const status = document.getElementById("opsStatus");
      status.textContent = "Recording payment...";

      const res = await fetch("/ops-record-payment/" + encodeURIComponent(businessId), {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "x-admin-token": token()
        },
        body: JSON.stringify({ paidDate })
      });

      status.textContent = res.ok ? "Payment recorded." : await res.text();
      await loadClients();
    }

    async function sendReminders() {
      const status = document.getElementById("opsStatus");
      status.textContent = "Sending reminders...";

      const res = await fetch("/ops-send-billing-reminders", {
        method: "POST",
        headers: { "x-admin-token": token() }
      });

      if (!res.ok) {
        status.textContent = await res.text();
        return;
      }

      const data = await res.json();
      status.textContent = `Billing reminders sent: ${data.sent}`;
    }

    async function loadPayoutReport() {
      const status = document.getElementById("opsStatus");
      status.textContent = "Loading payout report...";

      const res = await fetch("/ops-partner-payout-report", {
        headers: { "x-admin-token": token() },
        cache: "no-store"
      });

      if (!res.ok) {
        status.textContent = await res.text();
        return;
      }

      const data = await res.json();
      const wrap = document.getElementById("payouts");

      if (!data.length) {
        wrap.innerHTML = "<div style='color:#64748b;'>No partner payouts found.</div>";
        status.textContent = "Payout report loaded.";
        return;
      }

      wrap.innerHTML = data.map(group => `
        <div class="payout-card">
          <div><strong>${escapeHtml(group.partnerName || "Unnamed Partner")}</strong></div>
          <div style="color:#64748b;margin-bottom:10px;">${escapeHtml(group.partnerEmail || "")}</div>
          <div style="font-weight:800;color:#1e3a8a;margin-bottom:10px;">Total Monthly Payout: ${money(group.totalMonthlyPayout)}</div>
          ${group.clients.map(c => `
            <div style="padding:8px 0;border-top:1px solid #e5e7eb;">
              <strong>${escapeHtml(c.businessName)}</strong> (${escapeHtml(c.businessId)})<br>
              Client Monthly: ${money(c.totalMonthlyPrice)} · Commission: ${Number(c.commissionPercent).toFixed(2)}% · Payout: ${money(c.monthlyPayout)} · Status: ${escapeHtml(c.billingStatus)}
            </div>
          `).join("")}
        </div>
      `).join("");

      status.textContent = "Payout report loaded.";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function escapeJs(value) {
      return String(value || "").replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    loadClients();
  </script>
</body>
</html>
